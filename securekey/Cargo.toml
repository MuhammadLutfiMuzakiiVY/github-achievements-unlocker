[package]
name = "securekey"
version = "0.1.0"
edition = "2021"
description = "SLH-DSA (SPHINCS+) Post-Quantum Key Management & Signing Tool"

[dependencies]
slh-dsa = "0.2.0-rc.5"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.22"
hex = "0.4"
sha2 = "0.10"
getrandom = "0.2"
rand = "0.8"
zeroize = { version = "1.8", features = ["zeroize_derive"] }
chrono = "0.4"
colored = "2.1"
